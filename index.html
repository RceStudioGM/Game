<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persimpangan Hati</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-notif" class="hidden">
        <span class="icon">✨</span>
        <div class="toast-text">
            <h4>Sesuatu Terbuka!</h4>
            <p>Cek menu untuk melihatnya.</p>
        </div>
    </div>

    <div id="game-container">
        <div id="main-menu" class="screen">
            <div class="menu-title-box">
                <h1>PERSIMPANGAN HATI</h1>
                <p>Visual Novel Romansa Sekolah</p>
            </div>
            <div class="menu-buttons">
                <button onclick="showNameInput()">▶ Mulai Game (Play)</button>
                <button onclick="showSettings()">⚙️ Pengaturan</button>
                <button onclick="showGallery()">📖 Koleksi Quotes 🔒</button>
            </div>
        </div>

        <div id="name-input-screen" class="screen hidden">
            <div class="menu-title-box">
                <h2>SIAPA NAMA KAMU?</h2>
                <p>Masukkan nama panggilan karakter utama</p>
            </div>
            <div class="menu-buttons">
                <input type="text" id="player-name-input" placeholder="Contoh: Adi" value="Adi" maxlength="15">
                <button onclick="startGameWithCustomName()">Mulai Masuk Cerita</button>
                <button onclick="backToMenu()" style="background: #e74c3c; border-color: #c0392b;">Batal</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div id="background-image"></div>
            
            <img id="char-left" class="character hidden" src="" alt="Karakter Kiri">
            <img id="char-right" class="character hidden" src="" alt="Karakter Kanan">
            
            <div id="dialogue-container">
                <div id="speaker-name-box">
                    <h3 id="speaker-name">Nama Karakter</h3>
                </div>
                <div id="dialogue-box">
                    <p id="dialogue-text">Teks cerita muncul di sini...</p>
                    <div id="choices-container">
                        </div>
                </div>
            </div>
        </div>

        <div id="sub-menu-screen" class="screen hidden">
            <h2 id="sub-menu-title">Judul Menu</h2>
            <div id="sub-menu-content"></div>
            <button onclick="backToMenu()" class="back-btn">Kembali ke Menu</button>
        </div>
                <!-- ===== LAYAR PROFIL KARAKTER ===== -->
        <div id="profile-screen" class="screen hidden">
            <h2 id="profile-title">📖 Profil Karakter</h2>
            <div id="profile-container" class="profile-grid">
                <!-- Kartu karakter akan di-generate oleh JS di sini -->
            </div>
            <button onclick="backToMenu()" class="back-btn">Kembali ke Menu</button>
        </div>
    </div>

    <!-- Ganti bagian ini -->
<script src="./fungsi/config.js"></script>
<script src="./fungsi/engine.js"></script>
<script src="./fungsi/story.js"></script>
<script src="./fungsi/main.js"></script>
</body>
</html>
