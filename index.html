<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notif Sepulang Sekolah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-notif" class="hidden">
        <span class="icon">✨</span>
        <div class="toast-text">
            <h4>Quote Baru Terbuka!</h4>
            <p>Cek menu Galeri untuk melihatnya.</p>
        </div>
    </div>

    <div id="game-container">
        <div id="main-menu" class="screen">
            <h1>Notif Sepulang Sekolah</h1>
            <p>Melodi di Atas Atap</p>
            <div class="menu-buttons">
                <button onclick="startGame('cowok')">Main sbg Cowok (Adit)</button>
                <button onclick="startGame('cewek')">Main sbg Cewek (Adinda)</button>
                <button onclick="showGallery()">Koleksi Quotes 🔒</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div id="background-image"></div>
            
            <img id="char-left" class="character hidden" src="" alt="Karakter Kiri">
            <img id="char-right" class="character hidden" src="" alt="Karakter Kanan">
            
            <div id="dialogue-container">
                <div id="speaker-name-box">
                    <h3 id="speaker-name">Nama Karakter</h3>
                </div>
                <div id="dialogue-box">
                    <p id="dialogue-text">Teks cerita muncul di sini...</p>
                    <div id="choices-container">
                        </div>
                </div>
            </div>
        </div>

        <div id="gallery-screen" class="screen hidden">
            <h2>Koleksi Quotes</h2>
            <div id="quotes-list"></div>
            <button onclick="backToMenu()" class="back-btn">Kembali ke Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
