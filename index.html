<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persimpangan Hati</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vn-gold': '#facc15',
                        'vn-dark': '#1a1a2e',
                    },
                    fontFamily: {
                        'display': ['"Playfair Display"', 'serif'],
                        'body': ['"Nunito"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vn-dark text-white font-body antialiased overflow-hidden h-screen w-screen flex items-center justify-center">

    <div id="toast-notif" class="hidden fixed top-5 right-5 bg-vn-gold text-black px-6 py-4 rounded-xl shadow-2xl z-50 transform transition-all duration-500 -translate-x-0">
        <div class="flex items-center gap-4">
            <span class="text-2xl">✨</span>
            <div>
                <h4 class="font-bold text-lg">Sesuatu Terbuka!</h4>
                <p class="text-sm opacity-80">Cek menu untuk melihatnya.</p>
            </div>
        </div>
    </div>

    <div id="game-container" class="relative w-[960px] h-[600px] overflow-hidden shadow-2xl rounded-2xl bg-black">
        
        <!-- MAIN MENU -->
        <div id="main-menu" class="screen flex flex-col justify-end w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('assets/lobby/bg.jpg');">
            <div class="absolute inset-0 bg-black/20 z-0"></div>
            <div id="sakura-container" class="absolute inset-0 z-10 pointer-events-none"></div>

            <div id="lobby-menu-bar" class="relative z-20 w-full bg-transparent py-6 flex justify-center items-center gap-10 text-lg font-bold tracking-wider">
                
                <!-- SVG GARIS ANGKA 9 (Presisi) -->
                <svg id="golden-svg" class="absolute -top-[3px] left-0 w-full h-[40px] pointer-events-none z-30" viewBox="0 0 960 40" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#facc15" />
                            <stop offset="50%" stop-color="#fde047" />
                            <stop offset="100%" stop-color="#facc15" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <!-- Path: Lurus ke kanan (940), lalu melingkar ke bawah dan kembali naik membentuk angka 9 sempurna -->
                    <path id="line-path" d="M 0 10 L 940 10 C 960 10 960 28 945 28 C 930 28 925 18 935 12 C 938 10 940 10 940 10" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)" stroke-linecap="round" />
                </svg>

                <button id="btn-continue" onclick="openSaveLoad('load')" class="menu-btn text-white/80 hover:text-vn-gold transition-colors duration-300 bg-transparent border-none cursor-pointer outline-none focus:outline-none focus:text-vn-gold" tabindex="0">
                    ▶ LANJUTKAN
                </button>
                <button onclick="showNameInput()" class="menu-btn text-white/80 hover:text-vn-gold transition-colors duration-300 bg-transparent border-none cursor-pointer outline-none focus:outline-none focus:text-vn-gold" tabindex="0">
                    MULAI BARU
                </button>
                <button onclick="showProfiles()" class="menu-btn text-white/80 hover:text-vn-gold transition-colors duration-300 bg-transparent border-none cursor-pointer outline-none focus:outline-none focus:text-vn-gold" tabindex="0">
                    PROFIL
                </button>
                <button onclick="showGallery()" class="menu-btn text-white/80 hover:text-vn-gold transition-colors duration-300 bg-transparent border-none cursor-pointer outline-none focus:outline-none focus:text-vn-gold" tabindex="0">
                    QUOTES
                </button>
                <button onclick="showSettings()" class="menu-btn text-white/80 hover:text-vn-gold transition-colors duration-300 bg-transparent border-none cursor-pointer outline-none focus:outline-none focus:text-vn-gold" tabindex="0">
                    PENGATURAN
                </button>
            </div>
        </div>

        <!-- NAME INPUT, GAME SCREEN, SUB MENU, PAUSE, SETTINGS, SAVELOAD, CONFIRM tetap sama seperti sebelumnya, tidak diubah -->
        <!-- ... (karena panjang, saya asumsikan kamu punya bagian ini dari kode sebelumnya, silakan copy paste dari file index.html sebelumnya) ... -->
        <!-- Saya cantumkan sisanya secara singkat agar jawaban tidak terlalu panjang, kamu bisa gabungkan dengan file index.html yang sudah kamu punya -->
        <!-- Di bawah ini adalah placeholder, kamu harus paste bagian menu lainnya dari kode sebelumnya -->
        <div id="name-input-screen" class="screen hidden ...">...</div>
        <div id="game-screen" class="screen hidden ...">...</div>
        <div id="sub-menu-screen" class="screen hidden ...">...</div>
        <div id="profile-screen" class="screen hidden ...">...</div>
        <div id="pause-overlay" class="...">...</div>
        <div id="settings-overlay" class="...">...</div>
        <div id="saveload-overlay" class="...">...</div>
        <div id="confirm-overlay" class="...">...</div>
    </div>

    <script src="./fungsi/main.js"></script>
    <script src="./fungsi/engine.js"></script>
    <script src="./fungsi/config.js"></script>
    <script src="./fungsi/story.js"></script>
</body>
</html>
